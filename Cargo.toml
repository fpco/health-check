[package]
name = "health-check"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive", "env"] }
nix = { version = "0.30.1", features = ["signal"] }
parking_lot = "0.12.5"
pid1 = "0.1.5"
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "rustls",
    "blocking",
] }
serde_json = "1.0.148"
signal-hook = "0.4.1"

[profile.release]
panic = 'abort'
strip = "symbols"
opt-level = 'z'
lto = true
codegen-units = 1
