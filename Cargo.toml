[package]
name = "health-check"
version = "0.9.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive", "env"] }
nix = { version = "0.31.2", features = ["signal"] }
parking_lot = "0.12.5"
pid1 = "0.1.6"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "rustls",
    "blocking",
] }
serde_json = "1.0.149"
signal-hook = "0.4.4"

[profile.release]
panic = 'abort'
strip = "symbols"
opt-level = 'z'
lto = true
codegen-units = 1
